name: Build & Release Patched Kiwi APK

on:
  push:
    branches:
      - patch-emudhra-compromise
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Patch & Release Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/patch_apk.sh
